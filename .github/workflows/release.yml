name: release
# Frozen builds → selftest with the network blocked → Inno installer (Windows) / .dmg (macOS).
# Windows also builds the GPU pack (CUDA build, gpu_pack.py) and selftests it from its install folders.
# A `v*` tag publishes both to GitHub Releases, then the updater's signed latest.json;
# PRs touching the build files only check Windows.
# macOS runs only on tags, or on workflow_dispatch with the macos box ticked: its minutes count 10x on a private repo.
# Other changes (e.g. flow_studio.py) build on demand: gh workflow run release --ref <branch>
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: Also build macOS (minutes count 10x)
        type: boolean
        default: false
  pull_request:
    paths:
      - FlowStudio.spec
      - FlowStudio.iss
      - package.ps1
      - package_gpu.py
      - gpu_pack.py
      - requirements-win.lock
      - .github/workflows/release.yml
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install pinned dependencies
        run: |
          uv venv --python 3.12 venv
          uv pip install --python venv\Scripts\python.exe -r requirements-win.lock pyinstaller==6.22.3
      - name: Ensure Inno Setup 6
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          .\package.ps1 -Version $ver
      - name: Install silently
        run: Start-Process .\FlowStudioSetup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
      - name: Selftest with the network blocked
        timeout-minutes: 15
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\FlowStudio\FlowStudio.exe"
          # Outbound block for the app only (loopback stays open for its own servers).
          New-NetFirewallRule -DisplayName "FlowStudio offline" -Direction Outbound -Program $exe -Action Block | Out-Null
          $p = Start-Process $exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\FlowStudio\flow_studio.log"   # windowed build: output goes here
          exit $p.ExitCode
      - name: Record sizes
        run: |
          $setup = (Get-Item FlowStudioSetup.exe).Length / 1MB
          $installed = (Get-ChildItem "$env:LOCALAPPDATA\Programs\FlowStudio" -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          "Installer: {0:N0} MB, installed: {1:N0} MB" -f $setup, $installed | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Get-ChildItem "$env:LOCALAPPDATA\Programs\FlowStudio" -Recurse -File | Sort-Object Length -Descending |
            Select-Object -First 25 @{n="MB"; e={[int]($_.Length / 1MB)}}, FullName | Format-Table -AutoSize | Out-String -Width 300
          # GitHub Releases rejects assets over 2 GiB.
          if ($setup -ge 2048) { throw "installer is over the 2 GiB GitHub Releases limit" }
      - name: Build the GPU pack
        # The same app on torch's CUDA 12.6 wheel (ctranslate2 4.8 needs cuBLAS 12 + cuDNN 9, which it
        # ships), split into core + NVIDIA-libs zips and gpu-pack.json (package_gpu.py).
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          uv pip install --python venv\Scripts\python.exe "torch==2.13.0+cu126" --index-url https://download.pytorch.org/whl/cu126
          if ($LASTEXITCODE) { throw "CUDA torch install failed" }
          $env:FLOW_VERSION = $ver
          venv\Scripts\python.exe -m PyInstaller FlowStudio.spec --noconfirm --distpath dist-gpu --workpath build-gpu
          if ($LASTEXITCODE) { throw "PyInstaller failed" }
          venv\Scripts\python.exe package_gpu.py dist-gpu\FlowStudio $ver gpu-out
          if ($LASTEXITCODE) { throw "package_gpu.py failed" }
          Remove-Item dist-gpu, build-gpu -Recurse -Force
          Get-ChildItem gpu-out | Select-Object Name, @{n="MB"; e={[int]($_.Length / 1MB)}} | Format-Table -AutoSize |
            Out-String | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - name: GPU pack selftest with the network blocked
        timeout-minutes: 15
        # No GPU on the runner, so this runs on the CPU, but from the installed pack: the app
        # from its core folder, the NVIDIA libs from theirs (torch won't import if they don't resolve).
        run: |
          venv\Scripts\python.exe -c "import json, pathlib, gpu_pack; gpu_pack.install(json.load(open('gpu-out/gpu-pack.json')), pathlib.Path('gpu-out'))"
          if ($LASTEXITCODE) { throw "installing the GPU pack failed" }
          $gpu = "$env:LOCALAPPDATA\FlowStudio\gpu"
          $m = Get-Content "$gpu\pack.json" | ConvertFrom-Json
          $exe = "$gpu\$($m.core)\FlowStudio.exe"
          New-NetFirewallRule -DisplayName "FlowStudio GPU offline" -Direction Outbound -Program $exe -Action Block | Out-Null
          $env:FLOW_GPU = "1"
          $env:FLOW_GPU_LIBS = "$gpu\$($m.libs)"
          $env:HF_HUB_CACHE = "$env:LOCALAPPDATA\Programs\FlowStudio\models\hub"   # the CPU install's bundled models
          $p = Start-Process $exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\FlowStudio\flow_studio_gpu.log"
          exit $p.ExitCode
      - name: Launcher falls back to the CPU
        timeout-minutes: 10
        # The CPU build starts the pack; with no CUDA device its check fails and the CPU build carries on.
        run: |
          $p = Start-Process "$env:LOCALAPPDATA\Programs\FlowStudio\FlowStudio.exe" -PassThru
          $deadline = (Get-Date).AddMinutes(5)
          while ($true) {
            try { Invoke-WebRequest http://127.0.0.1:7600/ -TimeoutSec 2 -UseBasicParsing | Out-Null; break } catch {}
            if ((Get-Date) -gt $deadline) { throw "nothing answered on :7600" }
            Start-Sleep 1
          }
          Get-Content "$env:LOCALAPPDATA\FlowStudio\flow_studio.log"
          Get-Content "$env:LOCALAPPDATA\FlowStudio\flow_studio_gpu.log"
          $m = Get-Content "$env:LOCALAPPDATA\FlowStudio\gpu\pack.json" | ConvertFrom-Json
          if ($p.HasExited) { throw "the CPU build exited (code $($p.ExitCode))" }
          if (-not $m.failed) { throw "the launcher didn't record the failed GPU start" }
          "pack.json failed: $($m.failed)"
          Stop-Process -Name FlowStudio -Force
      - name: Publish to GitHub Releases
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # Whichever OS finishes first creates the release; the other uploads into it.
        run: |
          $assets = @("FlowStudioSetup.exe") + (Get-ChildItem gpu-out).FullName
          gh release create $env:GITHUB_REF_NAME @assets --title "Flow Studio $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE) { gh release upload $env:GITHUB_REF_NAME @assets }
  macos:
    if: github.ref_type == 'tag' || inputs.macos
    runs-on: macos-14   # arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install pinned dependencies
        run: |
          uv venv --python 3.12 venv
          uv pip install --python venv/bin/python -r requirements-mac.lock pyinstaller==6.22.3
      - name: Build .dmg
        run: ./package.sh "$([ "$GITHUB_REF_TYPE" = tag ] && echo "${GITHUB_REF_NAME#v}" || echo 0.0.0)"
      - name: Install from the .dmg
        run: |
          hdiutil attach FlowStudio.dmg -nobrowse -mountpoint /Volumes/FlowStudio
          ditto "/Volumes/FlowStudio/Flow Studio.app" "/Applications/Flow Studio.app"
          hdiutil detach /Volumes/FlowStudio
          codesign --verify --deep --strict "/Applications/Flow Studio.app"
      - name: Selftest with the network blocked
        timeout-minutes: 15
        run: |
          # Outbound block for the app only (loopback stays open for its own servers).
          offline='(version 1)(allow default)(deny network-outbound (remote ip "*:*"))(allow network-outbound (remote ip "localhost:*"))'
          if sandbox-exec -p "$offline" curl -sS --max-time 10 -o /dev/null https://huggingface.co; then
            echo "network block isn't working"; exit 1
          fi
          sandbox-exec -p "$offline" "/Applications/Flow Studio.app/Contents/MacOS/FlowStudio" --selftest
      - name: Record sizes
        run: |
          dmg=$(( $(stat -f %z FlowStudio.dmg) / 1048576 ))
          echo "dmg: ${dmg} MB, installed: $(du -sm "/Applications/Flow Studio.app" | cut -f1) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          find "/Applications/Flow Studio.app" -type f -size +20M -exec du -m {} + | sort -rn | head -25
          # GitHub Releases rejects assets over 2 GiB.
          if [ "$dmg" -ge 2048 ]; then echo "dmg is over the 2 GiB GitHub Releases limit"; exit 1; fi
      - name: Publish to GitHub Releases
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" FlowStudio.dmg --title "Flow Studio $GITHUB_REF_NAME" --generate-notes ||
            gh release upload "$GITHUB_REF_NAME" FlowStudio.dmg
  manifest:
    # The updater's signed latest.json (see updater.py), once the installers are on the release.
    # The Linux tarball comes from release-linux.yml, which `needs:` can't wait on: poll the release for it.
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Sign and publish latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "::warning::UPDATE_SIGNING_KEY secret is missing, no latest.json published (installed apps see no update)"; exit 0; fi
          files="FlowStudioSetup.exe FlowStudio.dmg" linux=flow-studio-linux-x86_64.tar.gz
          # release-linux.yml has a 90-minute timeout; give up a little after it (Windows and Mac still update).
          for i in $(seq 200); do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets[] | select(.state == "uploaded") | .name' | grep -qx "$linux"; then
              files="$files $linux"; break
            fi
            sleep 30
          done
          case "$files" in *"$linux"*) ;; *) echo "::warning::no $linux on the release, latest.json has no Linux update" ;; esac
          for f in $files; do gh release download "$GITHUB_REF_NAME" -p "$f"; done
          uv run --python 3.12 --with cryptography python updater.py manifest "${GITHUB_REF_NAME#v}" "$GITHUB_REF_NAME" $files
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json latest.json.sig --clobber
